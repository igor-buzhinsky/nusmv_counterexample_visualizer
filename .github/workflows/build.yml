name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21]
        include:
          # Oldest JDK that can run Gradle 9
          - os: ubuntu-latest
            java: 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Also validates the checksum of the committed Gradle wrapper jar. Staying on v5 (MIT): in v6, caching is
      # subject to proprietary license terms (https://blog.gradle.org/github-actions-for-gradle-v6).
      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            build/reports/tests/
            build/test-results/

      - name: Upload jars
        if: matrix.os == 'ubuntu-latest' && matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: jars
          overwrite: true
          path: |
            build/libs/visualizer-console.jar
            build/libs/visualizer-gui.jar

  java8-compatibility:
    name: Run jars on Java 8
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jars

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8

      - name: Compare console output with snapshots
        run: |
          java -version
          check() {
            rm -f actual.out
            # On a usage error, the tool prints the usage and exits with status 0
            if java -Dfile.encoding=UTF-8 -jar visualizer-console.jar "$1" actual.out $3 | grep "Usage:"; then
              exit 1
            fi
            diff -u "src/test/resources/golden/$2" actual.out
          }
          check example-input.txt example-input_annotateFormulas.out --annotateFormulas
          check example-input-nuxmv-reals.txt example-input-nuxmv-reals_allVars_annotateFormulas.out "--allVars --annotateFormulas"
          check src/test/resources/inputs/symbolic-values.txt symbolic-values.out ""

      - name: Start the GUI on a virtual display
        # The GUI must have loaded the input and still be running without exceptions when it is stopped after
        # 10 seconds. timeout runs inside xvfb-run so that the signal reaches java itself.
        run: |
          command -v xvfb-run > /dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          status=0
          xvfb-run -a timeout -k 5 10 java -jar visualizer-gui.jar example-input.txt > gui.log 2>&1 || status=$?
          cat gui.log
          if [ "$status" -ne 124 ]; then
            echo "Expected the GUI to be still running, but it exited with status $status"
            exit 1
          fi
          if grep -E "Exception|Error:" gui.log; then
            exit 1
          fi
          # The reader reports loop unwinding for the past-time properties of the example input
          grep -q "the loop has been unwound" gui.log
